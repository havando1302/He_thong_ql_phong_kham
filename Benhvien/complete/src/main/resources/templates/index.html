<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Hệ Thống | MEDICARE PRO</title>
    <link rel="stylesheet" href="/admin-saas.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at 15% 15%, rgba(14, 165, 233, 0.08) 0%, transparent 45%),
                        radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.08) 0%, transparent 45%),
                        var(--bg-app);
            position: relative;
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-surface);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            padding: 38px 34px;
            position: relative;
            z-index: 10;
        }
        .auth-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 28px;
        }
        .auth-brand-logo {
            width: 54px;
            height: 54px;
            border-radius: var(--radius-md);
            background: var(--primary-gradient);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin-bottom: 12px;
            box-shadow: 0 8px 20px var(--primary-glow);
        }
        .auth-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }
        .auth-subtitle {
            font-size: 0.86rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .auth-theme-toggle {
            position: absolute;
            top: 24px;
            right: 24px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Floating Theme Toggle -->
        <div class="auth-theme-toggle">
            <button type="button" class="theme-switch-btn" title="Chuyển chế độ Sáng / Tối">
                <i class="fas fa-moon"></i>
            </button>
        </div>

        <div class="auth-card">
            <!-- Brand -->
            <div class="auth-brand">
                <div class="auth-brand-logo">
                    <i class="fas fa-heartbeat"></i>
                </div>
                <h1 class="auth-title">MEDICARE PRO</h1>
                <p class="auth-subtitle">Hệ thống quản lý phòng khám & tiếp nhận bệnh nhân</p>
            </div>

            <!-- Notifications -->
            <div th:if="${error != null}" class="saas-alert alert-error error">
                <i class="fas fa-circle-exclamation"></i>
                <div class="saas-alert-content">
                    <span class="error" th:text="${error}"></span>
                </div>
                <button type="button" class="saas-alert-close">&times;</button>
            </div>

            <div th:if="${success != null}" class="saas-alert alert-success">
                <i class="fas fa-circle-check"></i>
                <div class="saas-alert-content">
                    <span th:text="${success}"></span>
                </div>
                <button type="button" class="saas-alert-close">&times;</button>
            </div>

            <!-- Login Form -->
            <form action="/login" method="post" id="loginForm">
                <input type="hidden" name="_csrf" th:value="${csrfToken}" />

                <div class="form-group" style="margin-bottom: 18px;">
                    <label class="form-label" for="username">Tên Đăng Nhập:</label>
                    <div class="input-icon-wrap">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" name="username" class="form-control" 
                               placeholder="Nhập tên đăng nhập (vd: admin)" required autofocus>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 24px;">
                    <label class="form-label" for="password">Mật Khẩu:</label>
                    <div class="input-icon-wrap">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" class="form-control" 
                               placeholder="Nhập mật khẩu" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-bottom: 18px;">
                    <i class="fas fa-right-to-bracket"></i> Đăng Nhập Hệ Thống
                </button>
            </form>

            <!-- Quick Register Link -->
            <div style="text-align: center; padding-top: 16px; border-top: 1px solid var(--border-default); font-size: 0.88rem; color: var(--text-muted);">
                Chưa có tài khoản bệnh nhân? 
                <a href="/register" style="color: var(--primary-600); font-weight: 700; margin-left: 4px;">
                    Đăng ký ngay <i class="fas fa-arrow-right"></i>
                </a>
            </div>

            <!-- Server info -->
            <div style="text-align: center; margin-top: 20px; font-size: 0.76rem; color: var(--text-muted);">
                <i class="fas fa-server"></i> Cổng kết nối máy chủ: 
                <code style="font-family: var(--font-mono); font-weight: 600;" th:text="'localhost:' + ${port}">localhost:8080</code>
            </div>
        </div>
    </div>

    <!-- AI Chatbox Fragment -->
    <div th:replace="~{fragments/chatbox :: chatbox}"></div>

    <script src="/admin-saas.js"></script>
</body>
</html>
