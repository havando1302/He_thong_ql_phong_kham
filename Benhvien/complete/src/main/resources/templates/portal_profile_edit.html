<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cập Nhật Hồ Sơ | Cổng Bệnh Nhân MEDICARE PRO</title>
    <link rel="stylesheet" href="/portal.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="portal-app-wrapper">
        <!-- Unified Patient Header & Tabs -->
        <div th:replace="~{fragments/portal_nav :: portal_header(active='profile')}"></div>

        <!-- Main Content Area -->
        <main class="portal-content-container">
            <div class="page-hero">
                <div class="hero-titles">
                    <h1 class="hero-main-title">
                        <i class="fas fa-user-pen"></i> Cập Nhật Hồ Sơ Bệnh Nhân
                    </h1>
                    <p class="hero-subtitle">
                        Chỉnh sửa thông tin cá nhân và phương thức liên lạc để phòng khám hỗ trợ tốt nhất.
                    </p>
                </div>
                <div class="hero-actions">
                    <a href="/portal/profile" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Quay Lại Hồ Sơ
                    </a>
                </div>
            </div>

            <!-- Edit Form Card -->
            <div class="saas-card" style="max-width: 860px; margin: 0 auto;">
                <div class="saas-card-header">
                    <div class="card-header-left">
                        <h3 class="card-title">
                            <i class="fas fa-id-card"></i> Biểu Mẫu Thông Tin
                        </h3>
                    </div>
                    <span class="card-subtitle">Các mục có dấu (<span style="color:var(--danger-solid);">*</span>) là bắt buộc</span>
                </div>

                <div class="saas-card-body">
                    <form action="/portal/profile" method="post" id="editProfileForm">
                        <input type="hidden" name="_csrf" th:value="${csrfToken}" />

                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label" for="name">Họ và Tên: <span class="required">*</span></label>
                                <div class="input-icon-wrap">
                                    <i class="fas fa-user"></i>
                                    <input type="text" id="name" name="name" class="form-control" 
                                           th:value="${fullName}" placeholder="Nhập họ và tên đầy đủ" required autofocus>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="phone">Số Điện Thoại: <span class="required">*</span></label>
                                <div class="input-icon-wrap">
                                    <i class="fas fa-phone"></i>
                                    <input type="tel" id="phone" name="phone" class="form-control" 
                                           th:value="${phone}" placeholder="Ví dụ: 0912345678" required>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="dob">Ngày Sinh: <span class="required">*</span></label>
                                <div class="input-icon-wrap">
                                    <i class="fas fa-calendar"></i>
                                    <input type="date" id="dob" name="dob" class="form-control" 
                                           th:value="${dobIso}" required>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="gender">Giới Tính: <span class="required">*</span></label>
                                <select id="gender" name="gender" class="form-control" required>
                                    <option value="Nam" th:selected="${gender == 'Nam'}">Nam</option>
                                    <option value="Nữ" th:selected="${gender == 'Nữ'}">Nữ</option>
                                    <option value="Khác" th:selected="${gender == 'Khác'}">Khác</option>
                                </select>
                            </div>

                            <div class="form-group col-span-full">
                                <label class="form-label" for="address">Địa Chỉ Thường Trú:</label>
                                <div class="input-icon-wrap">
                                    <i class="fas fa-location-dot"></i>
                                    <input type="text" id="address" name="address" class="form-control" 
                                           th:value="${address}" placeholder="Số nhà, tên đường, phường/xã, quận/huyện...">
                                </div>
                            </div>
                        </div>

                        <div class="form-actions-row" style="margin-top:24px;">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-save"></i> Lưu Thay Đổi
                            </button>
                            <a href="/portal/profile" class="btn btn-secondary btn-lg">
                                <i class="fas fa-xmark"></i> Hủy Bỏ
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <!-- Unified Patient Footer -->
        <div th:replace="~{fragments/portal_nav :: portal_footer}"></div>
    </div>

    <!-- AI Chatbox Assistant -->
    <div th:replace="~{fragments/chatbox :: chatbox}"></div>

    <!-- Core Scripts -->
    <script src="/admin-saas.js"></script>
</body>
</html>
